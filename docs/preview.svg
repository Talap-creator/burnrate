<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif">
  <defs>
    <clipPath id="stack"><rect x="40" y="128" width="560" height="8" rx="4"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1b1a"/>
      <stop offset="1" stop-color="#161514"/>
    </linearGradient>
  </defs>

  <rect width="960" height="330" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="959" height="329" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- header row -->
  <g font-size="14">
    <text x="40" y="62" fill="#8b8986">5h</text>
    <rect x="64" y="53" width="72" height="6" rx="3" fill="#8a8a8a" fill-opacity="0.22"/>
    <rect x="64" y="53" width="15" height="6" rx="3" fill="#d97757"/>
    <text x="146" y="62" fill="#ecebe8" font-weight="650">21%</text>
    <text x="182" y="62" fill="#8b8986">2h 13m</text>

    <text x="266" y="62" fill="#8b8986">7d</text>
    <rect x="290" y="53" width="72" height="6" rx="3" fill="#8a8a8a" fill-opacity="0.22"/>
    <rect x="290" y="53" width="6" height="6" rx="3" fill="#d97757"/>
    <text x="372" y="62" fill="#ecebe8" font-weight="650">4%</text>
    <text x="398" y="62" fill="#8b8986">4d 20h</text>

    <text x="482" y="62" fill="#8b8986">ctx</text>
    <rect x="512" y="53" width="72" height="6" rx="3" fill="#8a8a8a" fill-opacity="0.22"/>
    <rect x="512" y="53" width="18" height="6" rx="3" fill="#6c9ef8"/>
    <text x="594" y="62" fill="#ecebe8" font-weight="650">25%</text>
    <text x="632" y="62" fill="#8b8986">50k/200k</text>

    <text x="726" y="62" fill="#8b8986">cache</text>
    <text x="772" y="62" fill="#ecebe8" font-weight="650">91%</text>
    <text x="818" y="62" fill="#8b8986">$1.50</text>
    <rect x="874" y="44" width="40" height="26" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="894" y="62" fill="#cfcdc9" text-anchor="middle">▴</text>
  </g>

  <line x1="40" y1="96" x2="920" y2="96" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- context composition -->
  <text x="40" y="117" font-size="11" letter-spacing="1.2" fill="#6f6d6a">WHAT FILLS THE CONTEXT</text>
  <g clip-path="url(#stack)">
    <rect x="40" y="128" width="560" height="8" fill="#8a8a8a" fill-opacity="0.22"/>
    <rect x="40" y="128" width="268" height="8" fill="#d97757"/>
    <rect x="310" y="128" width="118" height="8" fill="#6c9ef8"/>
    <rect x="430" y="128" width="80" height="8" fill="#57ab5a"/>
    <rect x="512" y="128" width="40" height="8" fill="#b083f0"/>
    <rect x="554" y="128" width="26" height="8" fill="#e0a84f"/>
    <rect x="582" y="128" width="18" height="8" fill="#4fb3c4"/>
  </g>
  <g font-size="13">
    <circle cx="44" cy="160" r="4" fill="#d97757"/><text x="54" y="164" fill="#8b8986">Messages <tspan fill="#ecebe8">40k</tspan></text>
    <circle cx="164" cy="160" r="4" fill="#6c9ef8"/><text x="174" y="164" fill="#8b8986">System tools <tspan fill="#ecebe8">18k</tspan></text>
    <circle cx="306" cy="160" r="4" fill="#57ab5a"/><text x="316" y="164" fill="#8b8986">MCP tools <tspan fill="#ecebe8">12k</tspan></text>
    <circle cx="428" cy="160" r="4" fill="#b083f0"/><text x="438" y="164" fill="#8b8986">System prompt <tspan fill="#ecebe8">6.1k</tspan></text>
    <circle cx="582" cy="160" r="4" fill="#e0a84f"/><text x="592" y="164" fill="#8b8986">Memory files <tspan fill="#ecebe8">3.9k</tspan></text>
    <circle cx="726" cy="160" r="4" fill="#4fb3c4"/><text x="736" y="164" fill="#8b8986">Skills <tspan fill="#ecebe8">2.7k</tspan></text>
  </g>

  <!-- last turn -->
  <g font-size="13">
    <text x="40" y="200" fill="#6f6d6a">last turn</text>
    <text x="118" y="200" fill="#8b8986">cache read <tspan fill="#ecebe8">45k</tspan></text>
    <text x="238" y="200" fill="#8b8986">cache write <tspan fill="#ecebe8">3.0k</tspan></text>
    <text x="368" y="200" fill="#8b8986">uncached <tspan fill="#ecebe8">1.2k</tspan></text>
    <text x="478" y="200" fill="#8b8986">output <tspan fill="#ecebe8">800</tspan></text>
  </g>

  <!-- guard toasts -->
  <g font-size="13">
    <rect x="40" y="232" width="610" height="34" rx="9" fill="#d4a72c" fill-opacity="0.1" stroke="#d4a72c" stroke-opacity="0.35"/>
    <text x="56" y="254" fill="#e8cf86">⚠ Cache rewritten: 62k written, 0 read — ~12–20× a cached turn. Cause: model switched</text>
    <rect x="40" y="274" width="610" height="34" rx="9" fill="#e5534b" fill-opacity="0.1" stroke="#e5534b" stroke-opacity="0.35"/>
    <text x="56" y="296" fill="#f0a39e">🛑 5h limit at 87%: subagents and wide scans blocked, answers kept short</text>
  </g>
  <text x="920" y="296" font-size="12" fill="#6f6d6a" text-anchor="end">burnrate</text>
</svg>
